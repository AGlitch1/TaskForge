name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskforge
          POSTGRES_PASSWORD: taskforge
          POSTGRES_DB: taskforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U taskforge -d taskforge_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_NAME: TaskForge
      APP_ENV: test
      DEBUG: "false"

      DATABASE_URL: postgresql+psycopg://taskforge:taskforge@localhost:5432/taskforge_test
      REDIS_URL: redis://localhost:6379/0

      TEST_DATABASE_URL: postgresql+psycopg://taskforge:taskforge@localhost:5432/taskforge_test
      TEST_REDIS_URL: redis://localhost:6379/1

      WORKER_POLL_INTERVAL_SECONDS: 1
      WORKER_HEARTBEAT_INTERVAL_SECONDS: 5
      DEAD_WORKER_TIMEOUT_SECONDS: 30

      JOB_LEASE_SECONDS: 30
      LEASE_RENEW_INTERVAL_SECONDS: 10

      SCHEDULER_INTERVAL_SECONDS: 2
      SCHEDULER_LOCK_TTL_SECONDS: 10

      MAX_RETRIES_DEFAULT: 3

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          pytest